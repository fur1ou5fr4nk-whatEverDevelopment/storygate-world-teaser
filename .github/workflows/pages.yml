name: Verify and deploy StoryGate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: storygate-pages
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the locked dependency set
        run: npm ci

      - name: Run the release safeguards
        run: npm run release:check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy the verified site
        id: deployment
        uses: actions/deploy-pages@v4
