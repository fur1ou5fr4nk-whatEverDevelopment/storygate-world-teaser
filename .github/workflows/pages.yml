name: Verify and deploy StoryGate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: storygate-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-safeguards:
    name: Release safeguards
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install the locked dependency set
        run: npm ci

      - name: Run the release safeguards
        run: npm run release:check

  deploy-verified-site:
    name: Deploy verified site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release-safeguards
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact merged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the verified site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy the verified site
        id: deployment
        uses: actions/deploy-pages@v5
