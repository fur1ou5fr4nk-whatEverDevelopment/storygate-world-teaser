<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1718">
  <meta name="description" content="StoryGate — the gate is opening soon.">
  <title>StoryGate — Coming soon</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="portal-stage" id="portal" aria-label="StoryGate teaser">
    <img class="portal-image portal-image--sharp" src="./assets/teaser-source-original.png" alt="A wooden StoryGate emblem beside the sea">
    <img class="portal-image portal-image--blurred" src="./assets/teaser-source-original.png" alt="" aria-hidden="true">
    <div class="veil" aria-hidden="true"></div>

    <div class="wave" aria-hidden="true"></div>
    <div class="wave" aria-hidden="true"></div>
    <div class="wave" aria-hidden="true"></div>

    <img class="wordmark" src="./assets/storygate-wordmark-white.png" alt="StoryGate">

    <button class="gate" type="button" aria-label="Reveal StoryGate">
      <span class="gate-core" aria-hidden="true"></span>
    </button>

    <p class="tap-hint" aria-hidden="true">tap the gate</p>

    <section class="message message--first" aria-live="polite">
      <span class="word">Some</span>
      <span class="word">things</span>
      <span class="word">only</span>
      <span class="word">reveal</span>
      <span class="word">themselves</span>
      <span class="word">when</span>
      <span class="word">you</span>
      <span class="word">stay</span>
    </section>

    <section class="message message--final" aria-live="polite">
      <p class="still">Still tapping?</p>
      <div class="final-copy">
        <p class="wild">Good. The first story has already begun</p>
        <p class="open">The gate opens soon.</p>
      </div>
    </section>

    <section class="discoveries" aria-label="Hidden StoryGate details">
      <div class="discovery discovery--storygate" data-primary-discovery>
        <button class="discovery-star" type="button" data-discovery-id="storygate" aria-label="Discover what StoryGate is" aria-controls="detail-storygate" aria-expanded="false" aria-hidden="true" disabled></button>
        <a class="discovery-card" id="detail-storygate" data-discovery-card href="./coming-soon.html" aria-hidden="true" tabindex="-1">What is StoryGate?</a>
      </div>

      <div class="discovery discovery--demo" data-primary-discovery>
        <button class="discovery-star" type="button" data-discovery-id="demo" aria-label="Discover the simple demo" aria-controls="detail-demo" aria-expanded="false" aria-hidden="true" disabled></button>
        <a class="discovery-card" id="detail-demo" data-discovery-card href="./coming-soon.html" aria-hidden="true" tabindex="-1">simple demo</a>
      </div>

      <div class="discovery discovery--biography" data-biography-discovery aria-hidden="true">
        <button class="discovery-star discovery-star--small" type="button" data-biography-star aria-label="Discover the person behind StoryGate" aria-controls="detail-biography" aria-expanded="false" aria-hidden="true" disabled></button>
        <a class="discovery-card discovery-card--biography" id="detail-biography" data-discovery-card href="./frank-bodmann.html" aria-hidden="true" tabindex="-1">
          <span class="discovery-card__question">Who left the gate open?</span>
          <strong>Frank Bodmann</strong>
        </a>
      </div>
    </section>
  </main>
  <script type="module" src="./script.js"></script>
</body>
</html>
